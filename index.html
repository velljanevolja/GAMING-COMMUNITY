<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Community</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Rajdhani',sans-serif;
    background:#05070c;
    color:white;
    scroll-behavior:smooth;
    overflow-x:hidden;
}

.hero{
    position:relative;
    text-align:center;
    background:black;
    overflow:hidden;
}

.hero img{
    width:100%;
    max-width:1400px;
    margin:auto;
    display:block;
    filter:contrast(1.15) saturate(1.2);
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at center,rgba(0,0,0,0.2),rgba(0,0,0,0.85));
}

.hero-content{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:2;
}

.hero-title{
    font-family:'Orbitron',sans-serif;
    font-size:clamp(28px,3vw,50px);
    letter-spacing:5px;
    text-transform:uppercase;
    text-shadow:0 0 20px #00e5ff;
}

.scroll-btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 28px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    font-family:'Orbitron',sans-serif;
    background:linear-gradient(90deg,#00e5ff,#7b2cff,#ff2d7a);
    color:white;
    transition:0.3s;
    box-shadow:0 0 25px rgba(0,229,255,0.7);
}
.scroll-btn:hover{
    transform:scale(1.1);
}

.topbar{
    text-align:center;
    padding:14px;
    background:rgba(0,0,0,0.8);
    letter-spacing:3px;
    font-weight:bold;
}

main{
    padding:80px 20px;
    text-align:center;
}

h2{
    font-family:'Orbitron',sans-serif;
    font-size:34px;
    margin-bottom:40px;
    letter-spacing:5px;
}

.card{
    max-width:700px;
    margin:0 auto;
    background:rgba(255,255,255,0.05);
    padding:40px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 60px rgba(0,0,0,0.7);
}

.card h3{
    font-family:'Orbitron',sans-serif;
    letter-spacing:4px;
    margin-bottom:25px;
}

.price{
    font-size:45px;
    color:#ff2c2c;
    font-weight:bold;
    margin-bottom:30px;
}

.btns{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.btn{
    padding:16px;
    border-radius:15px;
    text-decoration:none;
    font-weight:bold;
    color:white;
    transition:0.3s;
}

.btn-wa{ background:#25D366; }

.btn-card{
    background:linear-gradient(90deg,#00e5ff,#7b2cff);
    box-shadow:0 0 20px rgba(0,229,255,0.7);
}

.btn:hover{
    transform:scale(1.05);
}

.strip{
    margin-top:50px;
    padding:20px;
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    font-size:16px;
}

footer{
    margin-top:50px;
    padding:25px;
    text-align:center;
    background:black;
    letter-spacing:3px;
}
</style>
</head>

<body>

<section class="hero">
    <img src="hero.jpg.png" alt="Gaming Banner">
    <div class="hero-content">
        <div class="hero-title">Gaming Community</div>
        <a href="#buy" class="scroll-btn">ENTER STORE</a>
    </div>
</section>

<div class="topbar">
    INSTANT DELIVERY • 24/7 SUPPORT • ONE VIP BUNDLE
</div>

<main id="buy">

<h2>Buy VIP Access</h2>

<div class="card">
    <h3>APEX LEGENDS • CALL OF DUTY • FORTNITE • BATTLEFIELD</h3>
    <div class="price">30 € / Month</div>

    <div class="btns">
        <a class="btn btn-wa" href="https://wa.me/385977716620" target="_blank">
            Contact on WhatsApp
        </a>

        <a class="btn btn-card" href="https://whop.com/gaming-community-afaa/vip-access-15-be6e" target="_blank">
            🔥 BUY VIP ACCESS NOW 🔥
        </a>
    </div>
</div>

<div class="strip">
    💰 Full access to all games • ⚡ Instant delivery • 🔒 Secure checkout
</div>

</main>

<footer>
    © 2026 Gaming Community
</footer>

</body>
</html>
