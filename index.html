<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vellja_Nevolja</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;background:#0f0f0f;color:#fff}

    /* HERO */
    .hero{
      position:relative;
      height:72vh;
      min-height:420px;
      overflow:hidden;
      background:#000;
    }
    .hero img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
      transform:scale(1.02);
    }
    .hero::after{
      content:"";
      position:absolute;inset:0;
      background:linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,.75));
    }
    .hero .title{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      z-index:2;text-align:center;padding:0 16px;
    }
    .hero h1{
      font-size:clamp(34px,5vw,70px);
      color:#00aaff;
      text-shadow:0 0 18px rgba(0,170,255,.8);
      letter-spacing:2px;
    }

    /* SHOP */
    main{max-width:1100px;margin:0 auto;padding:40px 16px;text-align:center}
    h2{margin:0 0 24px;letter-spacing:1px}

    .grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:16px;
    }
    .card{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      padding:18px;
      box-shadow:0 10px 25px rgba(0,0,0,.25);
      transition:.2s;
    }
    .card:hover{transform:translateY(-4px);box-shadow:0 14px 35px rgba(0,0,0,.35)}
    .card h3{margin:6px 0 10px;letter-spacing:1px}
    .price{font-size:26px;font-weight:800;color:#ff2c2c;margin-bottom:12px}

    .btn{
      display:inline-block;
      padding:10px 14px;
      border-radius:12px;
      background:#00aaff;
      color:#fff;
      text-decoration:none;
      font-weight:700;
    }
    .btn:hover{filter:brightness(1.05)}

    footer{
      margin-top:30px;
      text-align:center;
      padding:18px 12px;
      background:#000;
      border-top:1px solid rgba(255,255,255,.08);
      letter-spacing:2px;
      text-shadow:0 0 10px rgba(0,170,255,.55);
    }

    @media (max-width:900px){ .grid{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:560px){
      .hero{height:55vh;min-height:340px}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

  <section class="hero">
    <img src="hero.jpg" alt="Hero banner">
    <div class="title">
      <h1>Vellja_Nevolja</h1>
    </div>
  </section>

  <main>
    <h2>PONUDA</h2>

    <div class="grid">
      <div class="card">
        <h3>APEX LEGENDS</h3>
        <div class="price">25 €</div>
        <a class="btn" href="#">Kupi</a>
      </div>

      <div class="card">
        <h3>CALL OF DUTY</h3>
        <div class="price">25 €</div>
        <a class="btn" href="#">Kupi</a>
      </div>

      <div class="card">
        <h3>FORTNITE</h3>
        <div class="price">25 €</div>
        <a class="btn" href="#">Kupi</a>
      </div>
    </div>
  </main>

  <footer>© 2026 Vellja_Nevolja</footer>

</body>
</html>
