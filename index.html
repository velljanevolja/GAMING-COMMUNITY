<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vellja_Nevolja Gaming</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:white;
}

/* HERO */
.hero{
    position:relative;
    width:100%;
    height:70vh;
    overflow:hidden;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
}

.hero-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:2;
}

.hero-text h1{
    font-size:60px;
    color:#00aaff;
    text-shadow:0 0 20px #00aaff;
}

/* SHOP */
main{
    padding:60px 20px;
    text-align:center;
}

.products{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.card{
    background:#1a1a1a;
    padding:25px;
    border-radius:15px;
    width:260px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 20px #00aaff;
}

.card h3{
    margin-bottom:15px;
    font-size:20px;
}

.price{
    font-size:28px;
    color:#ff2c2c;
    font-weight:bold;
    margin-bottom:15px;
}

button{
    padding:10px 20px;
    background:#00aaff;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0088cc;
}

/* FOOTER */
footer{
    background:black;
    text-align:center;
    padding:20px;
    margin-top:40px;
    letter-spacing:2px;
    text-shadow:0 0 10px #00aaff;
}

/* RESPONSIVE */
@media(max-width:768px){
    .hero-text h1{
        font-size:35px;
    }
}

</style>
</head>

<body>

<section class="hero">
    <img src="zen-banner.jpg" alt="Gaming Banner">
    <div class="hero-text">
        <h1>Vellja_Nevolja</h1>
    </div>
</section>

<main>
    <h2 style="margin-bottom:40px;">PONUDA</h2>

    <div class="products">
        <div class="card">
            <h3>APEX LEGENDS</h3>
            <div class="price">25 €</div>
            <button>Kupi</button>
        </div>

        <div class="card">
            <h3>CALL OF DUTY</h3>
            <div class="price">25 €</div>
            <button>Kupi</button>
        </div>

        <div class="card">
            <h3>FORTNITE</h3>
            <div class="price">25 €</div>
            <button>Kupi</button>
        </div>
    </div>
</main>

<footer>
    © 2026 Vellja_Nevolja
</footer>

</body>
</html>
