<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamming Community</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Rajdhani',sans-serif;
    background:#05070c;
    color:white;
    scroll-behavior:smooth;
    overflow-x:hidden;
}

/* ===== HERO ===== */
.hero{
    position:relative;
    text-align:center;
    background:black;
    overflow:hidden;
}

.hero img{
    width:100%;
    max-width:1400px;
    margin:auto;
    display:block;
    filter:contrast(1.15) saturate(1.2);
}

/* DARK CINEMATIC OVERLAY */
.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at center,rgba(0,0,0,0.2),rgba(0,0,0,0.85));
}

/* LIGHTNING EFFECT */
.hero::before{
    content:"";
    position:absolute;
    inset:-40%;
    background:
    repeating-linear-gradient(120deg,
        rgba(0,255,255,0.15) 0px,
        rgba(0,255,255,0.15) 2px,
        transparent 3px,
        transparent 40px),
    repeating-linear-gradient(-120deg,
        rgba(123,44,255,0.12) 0px,
        rgba(123,44,255,0.12) 2px,
        transparent 3px,
        transparent 40px);
    animation:storm 2s infinite;
    opacity:0.15;
    mix-blend-mode:screen;
}

@keyframes storm{
    0%,100%{opacity:0.05;}
    50%{opacity:0.4;}
}

/* HERO TEXT */
.hero-content{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:2;
}

.hero-title{
    font-family:'Orbitron',sans-serif;
    font-size:clamp(28px,3vw,50px);
    letter-spacing:5px;
    text-transform:uppercase;
    animation:glitch 1.5s infinite;
}

@keyframes glitch{
    0%{text-shadow:2px 2px #00e5ff,-2px -2px #ff2d7a;}
    50%{text-shadow:-2px -2px #7b2cff,2px 2px #00e5ff;}
    100%{text-shadow:2px -2px #ff2d7a,-2px 2px #7b2cff;}
}

/* ENTER BUTTON */
.scroll-btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 28px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    font-family:'Orbitron',sans-serif;
    background:linear-gradient(90deg,#00e5ff,#7b2cff,#ff2d7a);
    color:white;
    transition:0.3s;
    box-shadow:0 0 25px rgba(0,229,255,0.7);
}
.scroll-btn:hover{
    transform:scale(1.1);
}

/* TOP BAR */
.topbar{
    text-align:center;
    padding:14px;
    background:rgba(0,0,0,0.8);
    letter-spacing:3px;
    font-weight:bold;
}

/* ===== MAIN ===== */
main{
    padding:80px 20px;
    text-align:center;
}

h2{
    font-family:'Orbitron',sans-serif;
    font-size:34px;
    margin-bottom:40px;
    letter-spacing:5px;
}

/* BUNDLE CARD */
.card{
    max-width:700px;
    margin:0 auto;
    background:rgba(255,255,255,0.05);
    padding:40px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 60px rgba(0,0,0,0.7);
    position:relative;
}

/* Animated glow border */
.card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:25px;
    background:conic-gradient(#00e5ff,#7b2cff,#ff2d7a,#00e5ff);
    animation:spin 4s linear infinite;
    z-index:-1;
    filter:blur(15px);
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.card h3{
    font-family:'Orbitron',sans-serif;
    letter-spacing:4px;
    margin-bottom:25px;
}

.price{
    font-size:45px;
    color:#ff2c2c;
    font-weight:bold;
    margin-bottom:30px;
    text-shadow:0 0 20px rgba(255,0,0,0.6);
}

.btns{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.btn{
    padding:16px;
    border-radius:15px;
    text-decoration:none;
    font-weight:bold;
    color:white;
    transition:0.3s;
}

.btn-wa{ background:#25D366; }
.btn-card{ background:linear-gradient(90deg,#00e5ff,#7b2cff); }
.btn-paypal{ background:linear-gradient(90deg,#003087,#009cde); }

.btn:hover{
    transform:scale(1.05);
}

/* STRIP */
.strip{
    margin-top:50px;
    padding:20px;
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    font-size:16px;
    letter-spacing:1px;
}

/* FOOTER */
footer{
    margin-top:50px;
    padding:25px;
    text-align:center;
    background:black;
    letter-spacing:3px;
}
</style>
</head>

<body>

<section class="hero">
    <img src="hero.jpg.png" alt="Gaming Banner">
    <div class="hero-content">
        <div class="hero-title">Gamming Community</div>
        <a href="#buy" class="scroll-btn">ENTER STORE</a>
    </div>
</section>

<div class="topbar">
    INSTANT DELIVERY • 24/7 SUPPORT • ONE BUNDLE
</div>

<main id="buy">

<h2>Buy</h2>

<div class="card">
    <h3>APEX LEGENDS • CALL OF DUTY • FORTNITE</h3>
    <div class="price">30 €</div>

    <div class="btns">
        <a class="btn btn-wa" href="https://wa.me/385977716620" target="_blank">
            Contact: WhatsApp (+385977716620)
        </a>

        <a class="btn btn-card" href="#">
            Card Purchase
        </a>

        <a class="btn btn-paypal" href="https://www.paypal.com" target="_blank">
            PayPal Purchase
        </a>
    </div>
</div>

<div class="strip">
    💰 <b>PRICE: 30 € for all</b> • ⚡ Instant support • 🔒 Secure payment
</div>

</main>

<footer>
    © 2026 Gaming Shop ~ Vellja_Nevolja
</footer>

</body>
</html>
