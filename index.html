<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming Community</title>

  <style>
    :root{
      --bg:#0f0f0f;
      --card:#1a1a1a;
      --accent:#ff2c2c;
      --accent2:#6a00ff;
      --text:#ffffff;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    /* HERO */
    .hero{
      position:relative;
      width:100%;
      height: min(70vh, 720px);   /* dobro za velike monitore */
      min-height: 420px;         /* da ne bude premalo */
      overflow:hidden;
      background:#000;
    }
    .hero img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;          /* uvijek popuni prostor */
      object-position:center;    /* centriraj (najbolje za ovu sliku) */
      transform: scale(1.03);    /* lagano “zoom” da izgleda punije */
      filter: contrast(1.05) saturate(1.05);
    }
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      /* tamni overlay + malo vignette efekta */
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.70) 70%),
        linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.75));
      pointer-events:none;
    }

    .hero-text{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 0 16px;
      z-index:2;
    }
    .hero-text h1{
      margin:0;
      font-size: clamp(34px, 5vw, 68px);
      letter-spacing: 2px;
      color: var(--accent);
      text-shadow: 0 0 18px rgba(255,44,44,0.75), 0 0 40px rgba(106,0,255,0.25);
    }
    .hero-text p{
      margin: 10px 0 0;
      opacity:0.9;
      font-size: clamp(14px, 2vw, 20px);
    }

    /* NAV */
    nav{
      position: sticky;
      top:0;
      z-index:5;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display:flex;
      justify-content:center;
      gap: 18px;
    }
    nav a{
      color: #fff;
      text-decoration:none;
      font-size: 16px;
      padding: 8px 14px;
      border-radius: 10px;
      transition: 0.2s;
    }
    nav a:hover{
      background: rgba(255,44,44,0.18);
      color: #fff;
    }

    /* MAIN / SHOP */
    main{
      max-width: 1100px;
      margin: 0 auto;
      padding: 34px 16px 50px;
      text-align:center;
    }

    .section-title{
      margin: 10px 0 22px;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .product-card{
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.30);
    }

    .product-card h3{
      margin: 6px 0 10px;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .price{
      margin: 0 0 14px;
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 14px rgba(255,44,44,0.35);
    }

    .btn{
      display:inline-block;
      padding: 10px 14px;
      border-radius: 12px;
      text-decoration:none;
      color:#fff;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border: none;
      cursor:pointer;
      transition: transform .15s ease, filter .15s ease;
      font-weight:700;
      letter-spacing: .3px;
    }
    .btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    /* FOOTER */
    footer{
      text-align:center;
      padding: 18px 12px;
      background:#000;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 16px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,44,44,0.55);
    }

    /* RESPONSIVE */
    @media (max-width: 900px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px){
      .hero{ height: 55vh; min-height: 340px; }
      .grid{ grid-template-columns: 1fr; }
      nav{ gap: 10px; }
    }
  </style>
</head>

<body>

  <section class="hero">
    <img src="gaming.jpg.png" alt="Gaming Community">
    <div class="hero-text">
      <div>
        <h1>GAMING COMMUNITY</h1>
        <p>Apex Legends • Call of Duty • Fortnite</p>
      </div>
    </div>
  </section>

  <nav>
    <a href="#shop">Shop</a>
  </nav>

  <main id="shop">
    <div class="section-title">Ponuda</div>

    <div class="grid">
      <div class="product-card">
        <h3>APEX LEGENDS</h3>
        <div class="price">25 €</div>
        <a class="btn" href="#">Kupi</a>
      </div>

      <div class="product-card">
        <h3>CALL OF DUTY</h3>
        <div class="price">25 €</div>
        <a class="btn" href="#">Kupi</a>
      </div>

      <div class="product-card">
        <h3>FORTNITE</h3>
        <div class="price">25 €</div>
        <a class="btn" href="#">Kupi</a>
      </div>
    </div>
  </main>

  <footer>Vellja_Nevolja</footer>

</body>
</html>
