<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:white;
}

/* HERO */
.hero{
    width:100%;
    height:75vh;
    background:black;
    overflow:hidden;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* SHOP */
main{
    padding:60px 20px;
    text-align:center;
}

h2{
    margin-bottom:40px;
    letter-spacing:2px;
}

.products{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.card{
    background:#1a1a1a;
    padding:25px;
    border-radius:15px;
    width:260px;
    transition:0.3s;
    border:1px solid #2a2a2a;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 0 25px #00aaff55;
}

.card h3{
    margin-bottom:15px;
}

.price{
    font-size:28px;
    color:#ff2c2c;
    font-weight:bold;
    margin-bottom:15px;
}

button{
    padding:10px 20px;
    background:#00aaff;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0088cc;
}

/* FOOTER */
footer{
    background:black;
    text-align:center;
    padding:20px;
    margin-top:40px;
    letter-spacing:2px;
}
</style>
</head>

<body>

<section class="hero">
    <img src="hero.jpg" alt="Gaming Banner">
</section>

<main>
    <h2>PONUDA</h2>

    <div class="products">
        <div class="card">
            <h3>APEX LEGENDS</h3>
            <div class="price">25 €</div>
            <button>Kupi</button>
        </div>

        <div class="card">
            <h3>CALL OF DUTY</h3>
            <div class="price">25 €</div>
            <button>Kupi</button>
        </div>

        <div class="card">
            <h3>FORTNITE</h3>
            <div class="price">25 €</div>
            <button>Kupi</button>
        </div>
    </div>
</main>

<footer>
    © 2026 Gaming Shop
</footer>

</body>
</html>
