<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Community</title>

<style>
body {
    margin: 0;
    background-color: #0f0f0f;
    font-family: Arial, sans-serif;
    color: white;
}

/* HERO SLIKA */
.hero {
    position: relative;
}

.hero img {
    width: 100%;
    height: 600px;
    object-fit: cover;
    display: block;
}

/* NASLOV PREKO SLIKE */
.hero-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

.hero-text h1 {
    font-size: 60px;
    margin: 0;
    color: #ff2c2c;
    text-shadow: 0 0 20px #ff0000;
}

/* NAVIGACIJA */
nav {
    text-align: center;
    background: #000;
    padding: 15px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 20px;
    font-size: 18px;
}

nav a:hover {
    color: #ff2c2c;
}

/* SHOP SEKCIJA */
main {
    padding: 40px 20px;
    text-align: center;
}

.product-card {
    background: #1a1a1a;
    padding: 20px;
    margin: 20px auto;
    width: 250px;
    border-radius: 10px;
}

.product-card h3 {
    margin: 10px 0;
}

.product-card p {
    font-size: 20px;
    color: #ff2c2c;
    font-weight: bold;
}

.buttons a {
    display: inline-block;
    margin: 5px;
    padding: 8px 15px;
    background: #ff2c2c;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.buttons a:hover {
    background: #cc0000;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    background: #000;
    font-size: 18px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #ff0000;
}
</style>

</head>
<body>

<section class="hero">
    <img src="gaming.jpg" alt="Gaming Community">
    <div class="hero-text">
        <h1>GAMING COMMUNITY</h1>
    </div>
</section>

<nav>
    <a href="#shop">Shop</a>
</nav>

<main id="shop">

    <div class="product-card">
        <h3>APEX LEGENDS</h3>
        <p>25 €</p>
    </div>

    <div class="product-card">
        <h3>CALL OF DUTY</h3>
        <p>25 €</p>
    </div>

    <div class="product-card">
        <h3>FORTNITE</h3>
        <p>25 €</p>
    </div>

</main>

<footer>
    Vellja_Nevolja
</footer>

</body>
</html>
